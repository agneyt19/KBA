<!DOCTYPE html>

  <meta charset="UTF-8">

<body>
<nav>
  <strong>Library Management</strong> |
  <a href="login.html">Login</a> |
  <a href="signup.html">Sign Up</a> |
  <a href="add-book.html">Add Book</a> |
  <a href="view-books.html">View Books</a>

<hr>
<h1>Sign Up</h1>
<form action="login.html" method="post">
  <p><label>Full Name:<br><input type="text" name="fullname" required></label></p>
  <p><label>Email:<br><input type="email" name="email" required></label></p>
  <p><label>Phone:<br><input type="tel" name="phone"></label></p>
  <p><label>Role:<br>
    <select name="role">
      <option>Student</option>
      <option>Teacher</option>
      <option>Librarian</option>
    </select></label></p>
  <p><label>Password:<br><input type="password" name="password" minlength="6" required></label></p>
  <p><label>Confirm Password:<br><input type="password" name="confirm" minlength="6" required></label></p>
  <p><button type="submit">Create Account</button></p>
</form>
<p>Already registered? <a href="login.html">Login</a></p>
</body>
</html>
